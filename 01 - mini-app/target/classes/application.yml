server:
  port: 8080

spring:
  datasource:
    # Hostname "postgres" resolves to the postgres service on the compose network.
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:miniapp}
    username: ${DB_USER:miniapp}
    password: ${DB_PASS:miniapp}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      # Hostname "redis" resolves to the redis service on the compose network.
      host: ${REDIS_HOST:redis}
      port: 6379
