# Mini startup: Spring Boot API + Postgres + Redis
# All 3 services share the default compose network.
# Each service is reachable by its service name (postgres, redis, api) as DNS hostname.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miniapp
      POSTGRES_USER: miniapp
      POSTGRES_PASSWORD: miniapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniapp -d miniapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_NAME: miniapp
      DB_USER: miniapp
      DB_PASS: miniapp
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
